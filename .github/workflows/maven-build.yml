name: maven build workflow

on:
  push:
    branches:
      - main

  # pull_requests:
  #     branches:
  #      - main


jobs:
  build:
    
     runs_on: ubuntu:latest

     steps:
       - name: checkout code
         uses: actions/checkout@v4

       - name: check java
         run: java -version

       - name: check maven
         run: mvn -version

       - run: ls -la
        
       - name: build app
         run: mvn clean install
        