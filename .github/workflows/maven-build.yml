name: maven build workflow

on:
  push:
    branches:
      - main

  pull_request:
      branches:
       - main


jobs:
  build:
    
     runs-on: ubuntu

     steps:
       - name: checkout code from git
         uses: actions/checkout@v4

       - name: check java
         run: java -version

       - name: check maven version
         run: mvn -version

       - run: ls -la
        
       - name: build app
         run: mvn clean install
        